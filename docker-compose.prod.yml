x-api-service: &api_service
  image: ${APP_IMAGE:-a2413b08-pandasway.registry.twcstorage.ru/pandas-way-core/donation_alerts-app:latest}
  pull_policy: always
  env_file:
    - .env
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import http.client,sys; conn=http.client.HTTPConnection('127.0.0.1', 8000, timeout=2); conn.request('GET', '/'); response=conn.getresponse(); sys.exit(0 if response.status < 500 else 1)\""]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api_blue:
    <<: *api_service
    ports:
      - "8000:8000"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      rabbitmq:
        condition: service_healthy

  api_green:
    <<: *api_service
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      rabbitmq:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    command: >
      sh -eu -c '
        test -f /var/lib/caddy-runtime/upstreams.caddy || cp /etc/caddy/upstreams.template.caddy /var/lib/caddy-runtime/upstreams.caddy
        exec caddy run --config /etc/caddy/Caddyfile
      '
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/upstreams.caddy:/etc/caddy/upstreams.template.caddy:ro
      - ./var/caddy:/var/lib/caddy-runtime
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api_blue:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --interval 30 --cleanup --rolling-restart --label-enable
    environment:
      - DOCKER_API_VERSION=${DOCKER_API_VERSION}
      - REPO_USER=${CONTAINER_REGISTRY_USERNAME}
      - REPO_PASS=${CONTAINER_REGISTRY_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  caddy_data:
  caddy_config:
